<!doctype html>
<html lang="en"><head><title>Free website audit | SuperRank</title><meta name="description" content="Check how your website shows up on Google and in AI answers, with a fix for every issue."><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="/free-audit/favicon.png"><link rel="stylesheet" href="/free-audit/style.css"></head>
<body>
<header class="header"><div class="header__inner"><a href="https://superrank.si/" class="logo" aria-label="SuperRank home"><img src="/free-audit/logo.png" alt="" class="logo__icon"><span>super<b>rank</b></span></a><div class="header__actions"><a class="btn btn--ghost" href="https://superrank.si/">Back to superrank.si</a><a class="btn btn--dark" href="https://superrank.si/book-demo">Book a demo</a></div></div></header>
<main class="section section--flush audit-main">
  <div class="container audit-page">
    <h1 data-audit-title>Free website audit</h1>
    <p class="audit-page__sub" data-audit-sub>See how Google and AI assistants read your site, and what to fix first.</p>

    <form class="audit-form" data-audit-form novalidate>
      <label class="audit-form__field">
        <span class="sr-only">Your website</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 1.7 2.7 3.8 2.7 6.2S9.8 12.5 8 14.2C6.2 12.5 5.3 10.4 5.3 8S6.2 3.5 8 1.8Z"/></svg>
        <input type="text" name="website" placeholder="yourwebsite.com" autocomplete="url" inputmode="url" required>
      </label>
      <button type="submit" class="btn btn--primary btn--lg">Get my free audit</button>
    </form>
    <p class="audit-form__err" data-audit-err role="alert" hidden></p>
    <div class="audit-result frame" data-audit-result aria-live="polite" hidden></div>
  </div>
</main>
<script type="module" src="/free-audit/audit-form.js"></script>
</body></html>
