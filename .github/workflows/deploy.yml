name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build dashboard
        run: npm run build:web

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Without this, a failed step (e.g. `docker compose build` running
            # out of disk space) doesn't stop the script — it falls through to
            # `up -d`, which happily recreates the container from whatever
            # image already exists locally (the OLD one), passes its health
            # check, and the whole job reports success even though nothing
            # new was actually deployed. Confirmed real on the staging
            # equivalent of this workflow on 2026-07-22 (VPS out of disk
            # space), silently serving stale code while CI showed green.
            set -eo pipefail

            DIR="/home/zunkireelabs/devprojects/analytics-app-prod"

            # First-push bootstrap: create directory and clone if missing
            if [ ! -d "$DIR" ]; then
              echo "First deployment — bootstrapping $DIR"
              mkdir -p "$DIR"
              git clone -b main git@github.com:${{ github.repository }}.git "$DIR"
            fi

            cd "$DIR"
            git fetch origin
            git checkout main
            git pull origin main

            cat > .env << 'ENVEOF'
            # ── Database (production) ───────────────────────────────────────
            DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}

            # ── Google credentials (OAuth method) ────────────────────────────
            GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
            GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
            GOOGLE_OAUTH_REFRESH_TOKEN=${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
            GSC_PROPERTY=${{ vars.GSC_PROPERTY }}
            GA4_PROPERTY_ID=${{ vars.GA4_PROPERTY_ID }}

            # ── AI narrative ────────────────────────────────────────────────
            REPORT_PROVIDER=${{ vars.REPORT_PROVIDER }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            REPORT_MODEL_DAILY=${{ vars.REPORT_MODEL_DAILY }}
            REPORT_MODEL_MONTHLY=${{ vars.REPORT_MODEL_MONTHLY }}

            # ── Email ────────────────────────────────────────────────────────
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=${{ vars.SMTP_PORT }}
            SMTP_SECURE=${{ vars.SMTP_SECURE }}
            SMTP_USER=${{ vars.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            REPORT_EMAIL_FROM=${{ vars.REPORT_EMAIL_FROM }}
            REPORT_EMAIL_TO=${{ vars.REPORT_EMAIL_TO }}

            # ── Dashboard auth (production) ─────────────────────────────────
            SESSION_SECRET=${{ secrets.PROD_SESSION_SECRET }}
            COMPANY_SITE_ID=${{ vars.COMPANY_SITE_ID }}

            # ── Site identity ───────────────────────────────────────────────
            SITE_NAME=${{ vars.SITE_NAME }}
            TZ=${{ vars.TZ }}

            # ── Cron ─────────────────────────────────────────────────────────
            CRON_SCHEDULE=${{ vars.CRON_SCHEDULE }}

            # ── Deployment ───────────────────────────────────────────────────
            ANALYTICS_DOMAIN=${{ vars.PROD_DOMAIN }}
            ENVEOF

            docker compose build

            echo "Applying database migrations..."
            docker compose run --rm analytics node server/migrations/run.js

            docker compose up -d

            echo "Waiting for container to be healthy..."
            sleep 10
            CONTAINER="analytics-app-prod"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs "$CONTAINER" --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.PROD_DOMAIN }}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production health check passed (HTTP $HTTP_CODE)"
          else
            echo "Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
