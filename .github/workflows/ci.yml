name: CI

on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — check-error-leaks.js diffs against origin/${{ github.base_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build dashboard
        run: npm run build:web

      - name: Check opt-in flag deploy parity
        run: npm run check-env-parity

      - name: Check for raw error leaks into customer-facing content
        run: npm run check-error-leaks
        env:
          CI_BASE_REF: origin/${{ github.base_ref }}

  # The server test suite (node:test), on the same Node version as production and the build job above.
  #
  # Until this job existed no workflow ran the tests at all, which is how stale mocks (nine route test files that could not even
  # load) and real assertion failures sat unnoticed on main. The *.db.test.js suites and many ordinary suites read and write a real
  # Postgres, so a throwaway one is started as a service and migrated from server/migrations exactly as a deploy would; without it,
  # roughly 400 tests fail on ECONNREFUSED and say nothing about the code.
  #
  # Nothing here can reach a real database or provider: DATABASE_URL points only at the service container, no secrets are passed,
  # and the repository has no .env in CI. DB_SSL=off because the container has no TLS (server/db.js).
  test:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TEMPORARY: this job ran for the first time on PR 246 and found failures that already exist on main (see the commits that fix most of
    # them). Until the last few (the reconciler test's full-run flake, the e2e design-validation import, the "no code merges a pull request"
    # rule, action-center.page-type.test.js) are fixed, a red result must not block a PR. The job still runs and its log still shows every
    # failure. Remove this line when the suite is green.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      DB_SSL: 'off'
      COMPANY_SITE_ID: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Applies every migration in order, then seeds the configured site (which needs these two placeholder values; they name
      # nothing real).
      - name: Migrate the test database
        run: node server/migrations/run.js
        env:
          GSC_PROPERTY: sc-domain:example.test
          GA4_PROPERTY_ID: '1'

      - name: Run server tests
        run: node --experimental-test-module-mocks --test server/
